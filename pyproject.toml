[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dockerrun"
version = "0.1.0"
description = "Run commands in Docker containers with streaming stdin/stdout"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Systems Administration",
]
keywords = ["docker", "container", "subprocess", "streaming"]
dependencies = [
    "docker>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/dockerrun"
Repository = "https://github.com/yourusername/dockerrun"

[tool.hatch.build.targets.wheel]
packages = ["src/dockerrun"]

[dependency-groups]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[tool.pytest.ini_options]
markers = [
    "e2e: end-to-end tests that run real Docker containers with substantial workloads",
    "slow: tests that take a long time to run",
]

